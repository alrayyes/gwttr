# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  # The main package sits under cmd/gwttr rather than at the repository root,
  # so goreleaser's default of "." finds nothing to build. The binary is still
  # named after the project rather than the directory, which is why the
  # archives below are unchanged.
  - main: ./cmd/gwttr
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin

# dockers_v2, not the older dockers/docker_manifests pair: it drives buildx
# directly, so one entry builds and pushes the whole multi-arch manifest list
# instead of one image per arch plus a separate manifest-stitching step. The
# Dockerfile only COPYs a binary goreleaser already cross-compiled -- see
# rules/go-releases.md -- so there's nothing arch-specific left to configure
# beyond which platforms to ask buildx for.
dockers_v2:
  - images:
      - ghcr.io/alrayyes/gwttr
    tags:
      - "{{ .Version }}"
      - latest
    dockerfile: Dockerfile
    platforms:
      - linux/amd64
      - linux/arm64
    # Annotations, not labels: this is always a multi-platform manifest list
    # (goreleaser's dockers_v2 only ever builds through buildx), and a
    # manifest list has no image config of its own to hold OCI labels --
    # these land on the index instead, where `docker buildx imagetools
    # inspect` and the tag itself actually see them.
    annotations:
      org.opencontainers.image.name: "{{ .ProjectName }}"
      org.opencontainers.image.description: "A proof-of-concept Go client for wttr.in"
      org.opencontainers.image.source: "{{ .GitURL }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: "GPL-3.0"

archives:
  - formats: [tar.gz]
    # Names the OS and architecture the way uname reports them, so the archive
    # someone downloads matches what they typed to find out which one they need.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]

# release-please has already written the notes and created the release by the
# time goreleaser runs; all goreleaser does is hang the binaries on it. Left
# enabled, the release would carry its notes twice — once curated by
# release-please, once as a raw shortlog.
changelog:
  disable: true
