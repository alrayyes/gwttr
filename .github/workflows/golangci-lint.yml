name: golangci-lint
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
      # The same check pre-push runs. The action above only runs `run`.
      - name: golangci-lint fmt
        run: golangci-lint fmt --diff ./...
      # go mod edit -fmt has no check-only flag, so diff rather than write.
      - name: go.mod formatting
        run: go mod edit -fmt go.mod && git diff --exit-code go.mod
      # Broader than the formatting check above: catches a stale require, a
      # non-canonical version string, or a go.sum entry nothing imports anymore.
      - name: go mod tidy
        run: go mod tidy -diff
