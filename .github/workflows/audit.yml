name: Dependency audit

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Works out whether a pull request touched what an audit reads. A skipped job reports
  # success, so branch protection can still require it; a `paths:` filter on the workflow
  # would leave it pending forever. A push to main always audits.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      go: ${{ steps.groups.outputs.go }}
      bun: ${{ steps.groups.outputs.bun }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: groups
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          go=true
          bun=true
          if [ "${EVENT}" = pull_request ]; then
            files=$(git diff --name-only "${BASE}...HEAD")
            printf '%s\n' "${files}" | grep -Eq '(\.go$|^go\.(mod|sum)$|^\.github/workflows/audit\.yml$)' || go=false
            printf '%s\n' "${files}" | grep -Eq '^(package\.json|bun\.lock|\.github/workflows/audit\.yml)$' || bun=false
          fi
          printf 'go=%s\nbun=%s\n' "${go}" "${bun}" >> "$GITHUB_OUTPUT"

  # Both audits fail only on advisories this change adds over its base (rules/dependencies.md).
  # What is already on main is the scan's to track, in advisory-scan.yml.
  govulncheck:
    needs: changes
    # A failed changes job still runs the gate: a missing base must not read as nothing changed.
    if: ${{ !cancelled() && (needs.changes.result == 'failure' || needs.changes.outputs.go == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Pinned to a main commit of alrayyes/advisory-scan until its first release; re-pin then.
      - uses: alrayyes/advisory-scan@425418a63e80eb10142fbd2e82127b7ef3a51d68
        with:
          mode: gate
          command: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  # bun audit reads the lockfile, so neither side needs an install.
  bun-audit:
    needs: changes
    # A failed changes job still runs the gate: a missing base must not read as nothing changed.
    if: ${{ !cancelled() && (needs.changes.result == 'failure' || needs.changes.outputs.bun == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: alrayyes/advisory-scan@425418a63e80eb10142fbd2e82127b7ef3a51d68
        with:
          mode: gate
          command: bun audit
