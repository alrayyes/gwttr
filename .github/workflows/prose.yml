name: Prose

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Style. Vale reports and does not fail the build: style advice that blocks a
  # merge just teaches people to reach for --no-verify.
  vale:
    name: style
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Vale
        run: |
          curl -sSfL --retry 3 --retry-connrefused --retry-delay 5 \
            "https://github.com/errata-ai/vale/releases/download/v3.17.1/vale_3.17.1_Linux_64-bit.tar.gz" \
            | tar -xz -C /usr/local/bin vale
      # The style packages are downloaded rather than committed, so this has to
      # run before vale itself or there are no rules to check against.
      - name: Sync style packages
        run: vale sync
      # Same command the hooks run, so the two can't disagree about scope.
      # No bun install needed: the script only shells out to vale.
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Run Vale
        run: bun run prose

  # Mechanics. Grammar and spelling have a right answer, so this one is a gate.
  # ghcr.io/alrayyes/ltex-cli-plus builds the ~200 MB tarball (its own Java
  # runtime included) into an image once, instead of this job downloading and
  # unpacking it fresh on every run - still kept out of the git hooks, same
  # reasoning as before, just no longer duplicated in CI either. The image also
  # bakes in git and nodejs, so actions/checkout needs no separate install step.
  ltex:
    name: grammar
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ghcr.io/alrayyes/ltex-cli-plus:18.7.0@sha256:22452e86a130e528d526b60792926002983fcbf732bff09bd4e843d22816e4ea
      # ltex-cli-plus is the image's own entrypoint, which leaves no shell for
      # a step to run in - clearing it gets one back.
      options: --entrypoint ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # ltex-cli-plus exits 3 on findings, not 1. Testing for a specific code
      # would pass a failing document, so this checks for any non-zero.
      - name: Check grammar and spelling
        run: |
          set +e
          /usr/local/bin/ltex-cli-plus --client-configuration=.ltex.json README.md CONTRIBUTING.md
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          # Any non-zero fails the job, but only 3 means the document has
          # something wrong with it. Anything else is a broken job, and saying
          # so stops the next person hunting for a typo that isn't there.
          if [ "$status" -eq 3 ]; then
            echo "ltex-cli-plus found grammar or spelling problems" >&2
          else
            echo "ltex-cli-plus failed to run (exit $status)" >&2
          fi
          exit 1
