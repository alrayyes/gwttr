# See GitHub's documentation for more information on this file:
# https://docs.github.com/en/code-security/supply-chain-security/keeping-your-dependencies-updated-automatically/configuration-options-for-dependency-updates
version: 2
updates:
  - package-ecosystem: "gomod"
    directories:
      - "/"
    schedule:
      interval: "daily"
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "daily"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
  # The stub Dockerfile that pins gitleaks for .github/workflows/gitleaks.yml.
  # Dependabot doesn't read a workflow's `container:`, so the pin lives here.
  # ci: because it changes the pipeline, not what ships.
  - package-ecosystem: "docker"
    directory: "/.github/gitleaks"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Amsterdam"
    commit-message:
      prefix: "ci"
      include: "scope"
    # A group, even of one, keeps a bump on Dependabot's lowercase group-title
    # template instead of the sentence-case single-update one, which fails
    # commitlint's subject-case rule (rules/release-bots.md).
    groups:
      gitleaks:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      gitleaks-major:
        patterns: ["*"]
        update-types: ["major"]
