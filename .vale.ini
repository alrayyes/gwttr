StylesPath = styles
MinAlertLevel = warning
Packages = Google, proselint
Vocab = House

[*.md]
BasedOnStyles = Vale, Google, proselint

# The vocabulary already spells every product name the way it's meant to be
# spelled. This is what holds the prose to it, so "Github" and "NPM" get flagged
# where GitHub and npm are the accepted forms.
Vale.Terms = YES

# Google's style guide bans first person plural. This is a one-maintainer
# project and the README says "you" throughout, so the rule has nothing to catch
# here and only fires on the odd quoted sentence.
Google.We = NO
