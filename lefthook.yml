skip_lfs: true

commit-msg:
  commands:
    "lint commit message":
      run: bunx commitlint --edit {1}

pre-push:
  parallel: true
  jobs:
    - run: bun run lint .
    - run: bun run markdown:lint .

    - run: go mod download && go build -v ./...

    - run: golangci-lint run ./...
    - run: golangci-lint fmt ./...
    - run: go test -cover ./...

pre-commit:
  parallel: true
  jobs:
    - run: bun run lint:fix .
      glob: "*"
      stage_fix: true
    - run: bun run markdown:format {staged_files}
      glob: "*.md"
      stage_fix: true

    - run: go generate ./...
      glob: "*.go"

    - run: go mod download && go build -v ./...
      glob: "*.go"

    - run: golangci-lint run --fix ./...
      glob: "*.go"
      stage_fix: true
    - run: golangci-lint fmt ./...
      glob: "*.go"
      stage_fix: true

    - run: go test -cover ./...
      glob: "*.go"
