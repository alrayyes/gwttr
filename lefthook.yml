skip_lfs: true

commit-msg:
  commands:
    "lint commit message":
      run: bunx commitlint --edit {1}

pre-push:
  parallel: true
  jobs:
    - run: bun run lint .

    # Piped, because Prettier decides the layout and markdownlint then judges
    # what Prettier produced. The other order has markdownlint reporting on
    # something Prettier is about to rewrite. Check mode only — nothing under a
    # push may write.
    - name: prose and yaml
      group:
        piped: true
        jobs:
          - run: bun run format:check
          - run: bun run md:lint
          # Reports only. Style is advice, and advice that fails a push is how
          # people learn to reach for --no-verify. LTeX is the tier that gates,
          # and it runs in CI.
          - run: bun run prose

    # Through Docker, pinned to the go directive in go.mod: a host go/
    # golangci-lint pairing that's quietly drifted apart is never the thing
    # a push finds out about (rules/go-mod.md). --user matches the host UID
    # so a write lands owned by whoever's pushing, not root; GOCACHE and
    # GOMODCACHE need their own writable mounts since --user leaves $HOME
    # unset and go's defaults for both resolve under /root.
    - run: >-
        docker run --rm --user "$(id -u):$(id -g)" -v "$(pwd):/src" -w /src
        -e GOCACHE=/gocache -v "$HOME/.cache/go-build-docker:/gocache"
        -e GOMODCACHE=/gomod -v "$HOME/.cache/go-mod-docker:/gomod"
        golang:1.27.1-bookworm sh -c "go mod download && go build -v ./..."
    # go mod edit -fmt has no check-only flag, so diff rather than write.
    - run: >-
        docker run --rm --user "$(id -u):$(id -g)" -v "$(pwd):/src" -w /src
        -e GOCACHE=/gocache -v "$HOME/.cache/go-build-docker:/gocache"
        -e GOMODCACHE=/gomod -v "$HOME/.cache/go-mod-docker:/gomod"
        golang:1.27.1-bookworm go mod edit -fmt go.mod
        && git diff --exit-code go.mod
    # Broader than the -fmt check above: catches a stale require, a
    # non-canonical version string, or a go.sum entry nothing imports anymore.
    - run: >-
        docker run --rm --user "$(id -u):$(id -g)" -v "$(pwd):/src" -w /src
        -e GOCACHE=/gocache -v "$HOME/.cache/go-build-docker:/gocache"
        -e GOMODCACHE=/gomod -v "$HOME/.cache/go-mod-docker:/gomod"
        golang:1.27.1-bookworm go mod tidy -diff

    # Through Docker, pinned to the same version CI runs: the image bundles
    # its own matched go build, so a host golangci-lint/go pairing that's
    # quietly drifted apart is never the thing a push finds out about.
    - run: >-
        docker run --rm --user "$(id -u):$(id -g)" -v "$(pwd):/src" -w /src
        -e GOCACHE=/gocache -v "$HOME/.cache/go-build-docker:/gocache"
        -e GOLANGCI_LINT_CACHE=/cache -v "$HOME/.cache/golangci-lint-docker:/cache"
        golangci/golangci-lint:v2.13.2 golangci-lint run ./...
    # --diff, not the writing form: a hook that rewrites files under a push
    # leaves the pushed commit and the working tree disagreeing about what was
    # reviewed.
    - run: >-
        docker run --rm --user "$(id -u):$(id -g)" -v "$(pwd):/src" -w /src
        -e GOCACHE=/gocache -v "$HOME/.cache/go-build-docker:/gocache"
        -e GOLANGCI_LINT_CACHE=/cache -v "$HOME/.cache/golangci-lint-docker:/cache"
        golangci/golangci-lint:v2.13.2 golangci-lint fmt --diff ./...
    # No -race here. The detector is slow enough that it would make every push
    # wait, so CI runs it instead. See .github/workflows/test.yml.
    - run: >-
        docker run --rm --user "$(id -u):$(id -g)" -v "$(pwd):/src" -w /src
        -e GOCACHE=/gocache -v "$HOME/.cache/go-build-docker:/gocache"
        -e GOMODCACHE=/gomod -v "$HOME/.cache/go-mod-docker:/gomod"
        golang:1.27.1-bookworm go test -cover ./...

    - run: goreleaser check

    # Pinned, same rule as golangci-lint above. Never a floating :latest.
    - run: >-
        docker run --rm -i -v "$(pwd)/.hadolint.yaml:/.hadolint.yaml"
        hadolint/hadolint:v2.14.0@sha256:27086352fd5e1907ea2b934eb1023f217c5ae087992eb59fde121dce9c9ff21e
        < Dockerfile

    # hadolint reads the Dockerfile as text; this proves it still builds.
    # goreleaser copies a prebuilt binary in rather than compiling inside the
    # Dockerfile (rules/go-releases.md), so this stages one at the path the
    # Dockerfile's $TARGETPLATFORM COPY expects before handing buildx the
    # full repo as context. Unconditional here, unlike the pre-commit copy
    # below, the same way the rest of pre-push stays unconditional.
    - run: >-
        GOARCH=$(go env GOARCH) &&
        mkdir -p "linux/$GOARCH" &&
        CGO_ENABLED=0 GOOS=linux GOARCH="$GOARCH" go build -o "linux/$GOARCH/gwttr" ./cmd/gwttr &&
        docker build --platform "linux/$GOARCH" -t gwttr:lefthook-check . &&
        docker rmi gwttr:lefthook-check &&
        rm -rf linux

pre-commit:
  parallel: true
  jobs:
    - run: bun run lint:fix .
      glob: "*"
      stage_fixed: true

    # Same order as pre-push, with Prettier writing rather than checking. The
    # staged files are named explicitly rather than left to Prettier's own
    # glob, because stage_fixed only puts back files lefthook handed to the job.
    - name: prose and yaml
      glob: "*.{md,yml,yaml}"
      run: bun run format {staged_files} && bun run md:lint && bun run prose
      stage_fixed: true

    - run: go generate ./...
      glob: "*.go"

    # Through Docker, pinned to the go directive in go.mod — see the
    # pre-push comment above.
    - run: >-
        docker run --rm --user "$(id -u):$(id -g)" -v "$(pwd):/src" -w /src
        -e GOCACHE=/gocache -v "$HOME/.cache/go-build-docker:/gocache"
        -e GOMODCACHE=/gomod -v "$HOME/.cache/go-mod-docker:/gomod"
        golang:1.27.1-bookworm sh -c "go mod download && go build -v ./..."
      glob: "*.go"

    - run: >-
        docker run --rm --user "$(id -u):$(id -g)" -v "$(pwd):/src" -w /src
        -e GOCACHE=/gocache -v "$HOME/.cache/go-build-docker:/gocache"
        -e GOMODCACHE=/gomod -v "$HOME/.cache/go-mod-docker:/gomod"
        golang:1.27.1-bookworm go mod edit -fmt go.mod
      glob: "go.mod"
      stage_fixed: true

    # Through Docker, pinned to the same version CI and pre-push run — see
    # the pre-push comment above.
    - run: >-
        docker run --rm --user "$(id -u):$(id -g)" -v "$(pwd):/src" -w /src
        -e GOCACHE=/gocache -v "$HOME/.cache/go-build-docker:/gocache"
        -e GOLANGCI_LINT_CACHE=/cache -v "$HOME/.cache/golangci-lint-docker:/cache"
        golangci/golangci-lint:v2.13.2 golangci-lint run --fix ./...
      glob: "*.go"
      stage_fixed: true
    - run: >-
        docker run --rm --user "$(id -u):$(id -g)" -v "$(pwd):/src" -w /src
        -e GOCACHE=/gocache -v "$HOME/.cache/go-build-docker:/gocache"
        -e GOLANGCI_LINT_CACHE=/cache -v "$HOME/.cache/golangci-lint-docker:/cache"
        golangci/golangci-lint:v2.13.2 golangci-lint fmt ./...
      glob: "*.go"
      stage_fixed: true

    # Glob-scoped to the Dockerfile plus what it (indirectly, via the
    # binary) pulls in, so this is skipped entirely on a commit that
    # touches neither and cheap -- a warm layer cache -- on one that does.
    - run: >-
        docker run --rm -i -v "$(pwd)/.hadolint.yaml:/.hadolint.yaml"
        hadolint/hadolint:v2.14.0@sha256:27086352fd5e1907ea2b934eb1023f217c5ae087992eb59fde121dce9c9ff21e
        < Dockerfile
      glob: "{Dockerfile,**/*.go,go.mod,go.sum}"
    - run: >-
        GOARCH=$(go env GOARCH) &&
        mkdir -p "linux/$GOARCH" &&
        CGO_ENABLED=0 GOOS=linux GOARCH="$GOARCH" go build -o "linux/$GOARCH/gwttr" ./cmd/gwttr &&
        docker build --platform "linux/$GOARCH" -t gwttr:lefthook-check . &&
        docker rmi gwttr:lefthook-check &&
        rm -rf linux
      glob: "{Dockerfile,**/*.go,go.mod,go.sum}"
